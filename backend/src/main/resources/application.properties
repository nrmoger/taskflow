# JPA Configuration
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Token Configuration (Enterprise-Grade)
# Access Token: 15 minutes (short-lived, used for API calls)
jwt.access-token-expiration-ms=900000

# Refresh Token: 7 days (long-lived, used to refresh access token)
jwt.refresh-token-expiration-ms=604800000

# JWT Secret (Change this in production!)
jwt.secret=taskflow-default-secret-change-this-to-long-random-value-in-production
